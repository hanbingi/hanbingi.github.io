        /* ========== 加载动画 ========== */
        html.loading,
        html.loading body {
            overflow: hidden !important;
        }
        #loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 40%, #14224a 0%, #060b1f 45%, #000000 100%);
            transition: opacity .8s ease, visibility .8s ease;
        }
        #loader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .loader-ring {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 3px solid rgba(126, 200, 255, 0.15);
            border-top-color: #7ec8ff;
            border-right-color: rgba(126, 200, 255, 0.55);
            animation: loaderSpin 1s linear infinite;
            box-shadow: 0 0 24px rgba(126, 200, 255, 0.35),
                        inset 0 0 12px rgba(126, 200, 255, 0.15);
        }
        @keyframes loaderSpin { to { transform: rotate(360deg); } }
        .loader-text {
            margin-top: 22px;
            color: #d6e9ff;
            letter-spacing: 5px;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(126, 200, 255, 0.85),
                         0 0 22px rgba(80, 140, 255, 0.5);
            animation: loaderPulse 1.6s ease-in-out infinite;
        }
        @keyframes loaderPulse {
            0%, 100% { opacity: .45; }
            50% { opacity: 1; }
        }

        /* ========== 滚动支持 ========== */
        html, body {
            height: auto !important;
            min-height: 100% !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            scroll-behavior: smooth;
        }

        /* ========== 夜空背景层 ========== */
        #night-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: linear-gradient(to bottom, #000000 0%, #5788fe 100%);
        }
        #night-bg .filter {
            width: 100%; height: 100%;
            position: absolute;
            top: 0; left: 0;
            background: #fe5757;
            animation: colorChange 30s ease-in-out infinite;
            animation-fill-mode: both;
            mix-blend-mode: overlay;
        }
        @keyframes colorChange {
            0%, 100% { opacity: 0; }
            50% { opacity: .9; }
        }
        #night-bg .landscape {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('img/xkbg.png');
            background-size: 1000px 250px;
            background-repeat: repeat-x;
            background-position: center bottom;
        }
        #night-bg canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

            padding-bottom: 70vh;

    <!-- ========== 加载动画控制 ========== -->
    <script>
    (function() {
        var startedAt = Date.now();
        var MIN_TIME = 400;
        var APLAYER_TIMEOUT = 10000;

        function removeLoader() {
            var loader = document.getElementById('loader');
            if (!loader) return;
            loader.classList.add('hidden');
            document.documentElement.classList.remove('loading');
            setTimeout(function() { loader.remove(); }, 900);
        }

        function hideLoader() {
            var elapsed = Date.now() - startedAt;
            var delay = Math.max(0, MIN_TIME - elapsed);
            setTimeout(removeLoader, delay);
        }

        function waitWindowLoad() {
            if (document.readyState === 'complete') return Promise.resolve();
            return new Promise(function(resolve) {
                window.addEventListener('load', resolve, { once: true });
            });
        }

        function waitAllImages() {
            var imgs = Array.prototype.slice.call(document.images);
            return Promise.all(imgs.map(function(img) {
                if (img.complete) return Promise.resolve();
                return new Promise(function(resolve) {
                    img.addEventListener('load', resolve, { once: true });
                    img.addEventListener('error', resolve, { once: true });
                });
            }));
        }

        function waitFonts() {
            if (document.fonts && document.fonts.ready) {
                return document.fonts.ready.then(function(){}, function(){});
            }
            return Promise.resolve();
        }

        function waitMeting(maxWait) {
            return new Promise(function(resolve) {
                if (document.querySelector('.aplayer')) return resolve();
                var timer = setTimeout(resolve, maxWait || 10000);
                var observer = new MutationObserver(function() {
                    if (document.querySelector('.aplayer')) {
                        observer.disconnect();
                        clearTimeout(timer);
                        resolve();
                    }
                });
                observer.observe(document.body, { childList: true, subtree: true });
            });
        }

        Promise.all([
            waitWindowLoad(),
            waitAllImages(),
            waitFonts(),
            waitMeting(APLAYER_TIMEOUT)
        ]).then(hideLoader).catch(hideLoader);
    })();
    </script>

    <!-- ========== 星空 + 鼠标连线 + 流星 ========== -->
    <script>
    /* ---------- 星空 ---------- */
    function Star(id, x, y){
        this.id = id;
        this.x = x;
        this.y = y;
        this.r = Math.floor(Math.random()*2)+1;
        var alpha = (Math.floor(Math.random()*10)+1)/10/2;
        this.color = "rgba(255,255,255,"+alpha+")";
    }
    Star.prototype.draw = function() {
        ctx.fillStyle = this.color;
        ctx.shadowBlur = this.r * 2;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, 2 * Math.PI, false);
        ctx.closePath();
        ctx.fill();
    }
    Star.prototype.move = function() {
        this.y -= .15;
        if (this.y <= -10) this.y = HEIGHT + 10;
        this.draw();
    }

    /* ---------- 鼠标连线 Dot ---------- */
    function Dot(id, x, y) {
        this.id = id;
        this.x = x;
        this.y = y;
        this.r = Math.floor(Math.random()*5)+1;
        this.speed = .5;
        this.a = .5;
        this.aReduction = .005;
        this.dead = false;
        this.color = "rgba(255,255,255,"+this.a+")";
        this.linkColor = "rgba(255,255,255,"+this.a/4+")";
        this.dir = Math.floor(Math.random()*140)+200;
    }
    Dot.prototype.draw = function() {
        ctx.fillStyle = this.color;
        ctx.shadowBlur = this.r * 2;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, 2 * Math.PI, false);
        ctx.closePath();
        ctx.fill();
    }
    Dot.prototype.link = function() {
        if (this.id == 0) return;
        var p1 = getPreviousDot(this.id, 1);
        var p2 = getPreviousDot(this.id, 2);
        var p3 = getPreviousDot(this.id, 3);
        if (!p1) return;
        ctx.strokeStyle = this.linkColor;
        ctx.moveTo(p1.x, p1.y);
        ctx.beginPath();
        ctx.lineTo(this.x, this.y);
        if (p2) ctx.lineTo(p2.x, p2.y);
        if (p3) ctx.lineTo(p3.x, p3.y);
        ctx.stroke();
        ctx.closePath();
    }
    function getPreviousDot(id, stepback) {
        if (id == 0 || id - stepback < 0) return false;
        var d = dots[id - stepback];
        if (d && !d.dead) return d;
        return false;
    }
    Dot.prototype.move = function() {
        if (this.dead) return;
        this.a -= this.aReduction;
        if (this.a <= 0) { this.die(); return; }
        this.color = "rgba(255,255,255,"+this.a+")";
        this.linkColor = "rgba(255,255,255,"+this.a/4+")";
        this.x += Math.cos(degToRad(this.dir))*this.speed;
        this.y += Math.sin(degToRad(this.dir))*this.speed;
        this.draw();
        this.link();
    }
    Dot.prototype.die = function() {
        this.dead = true;
    }

    /* ---------- 流星 ---------- */
    function Meteor(initialDelay) {
        this.reset((initialDelay || 0) + Math.random() * 2500);
    }
    Meteor.prototype.reset = function(delay) {
        this.x = Math.random() * WIDTH * 1.4;
        this.y = -Math.random() * HEIGHT * 0.6 - 100;
        this.len = Math.random() * 180 + 140;
        this.speed = Math.random() * 6 + 6;
        this.angle = Math.PI / 4;
        this.opacity = Math.random() * 0.5 + 0.4;
        this.width = Math.random() * 1.5 + 1;
        this.active = false;
        this.startAt = performance.now() + delay;
    };
    Meteor.prototype.update = function(now) {
        if (!this.active) {
            if (now >= this.startAt) this.active = true;
            else return;
        }
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        var tailY = this.y - Math.sin(this.angle) * this.len;
        if (this.y > HEIGHT + 100 || tailY > HEIGHT + 50 || this.x - this.len > WIDTH + 100) {
            this.reset(Math.random() * 2500 + 800);
        }
    };
    Meteor.prototype.draw = function() {
        if (!this.active) return;
        var tailX = this.x - Math.cos(this.angle) * this.len;
        var tailY = this.y - Math.sin(this.angle) * this.len;

        var grad = mctx.createLinearGradient(this.x, this.y, tailX, tailY);
        grad.addColorStop(0,   'rgba(255,255,255,' + this.opacity + ')');
        grad.addColorStop(0.25,'rgba(200,220,255,' + (this.opacity*0.65) + ')');
        grad.addColorStop(1,   'rgba(255,255,255,0)');
        mctx.strokeStyle = grad;
        mctx.lineWidth = this.width;
        mctx.lineCap = 'round';
        mctx.beginPath();
        mctx.moveTo(this.x, this.y);
        mctx.lineTo(tailX, tailY);
        mctx.stroke();

        var headGrad = mctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 5);
        headGrad.addColorStop(0, 'rgba(255,255,255,' + this.opacity + ')');
        headGrad.addColorStop(1, 'rgba(255,255,255,0)');
        mctx.fillStyle = headGrad;
        mctx.beginPath();
        mctx.arc(this.x, this.y, 5, 0, Math.PI*2);
        mctx.fill();
    };

    /* ---------- 初始化 ---------- */
    var canvas = document.getElementById('canvas'),
        ctx    = canvas.getContext('2d'),
        meteorCanvas = document.getElementById('meteor-canvas'),
        mctx         = meteorCanvas.getContext('2d'),
        WIDTH, HEIGHT,
        mouseMoving = false,
        mouseMoveChecker,
        mouseX, mouseY,
        stars = [],
        initStarsPopulation = 80,
        dots = [],
        meteors = [],
        dotsMinDist = 2,
        maxDistFromCursor = 50;

    setCanvasSize();
    init();

    function setCanvasSize() {
        WIDTH  = document.documentElement.clientWidth;
        HEIGHT = document.documentElement.clientHeight;
        canvas.setAttribute("width", WIDTH);
        canvas.setAttribute("height", HEIGHT);
        meteorCanvas.setAttribute("width", WIDTH);
        meteorCanvas.setAttribute("height", HEIGHT);
    }

    function init() {
        ctx.strokeStyle = "white";
        ctx.shadowColor = "white";
        for (var i = 0; i < initStarsPopulation; i++) {
            stars[i] = new Star(i, Math.floor(Math.random()*WIDTH), Math.floor(Math.random()*HEIGHT));
        }
        ctx.shadowBlur = 0;

        for (var i = 0; i < 6; i++) {
            meteors.push(new Meteor(i * 1500));
        }

        animate();
    }

    function animate(now) {
        if (!now) now = performance.now();

        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        mctx.clearRect(0, 0, WIDTH, HEIGHT);

        for (var i in stars) stars[i].move();
        for (var i in dots) {
            if (dots[i] && !dots[i].dead) dots[i].move();
        }
        drawIfMouseMoving();

        for (var i = 0; i < meteors.length; i++) {
            meteors[i].update(now);
            meteors[i].draw();
        }

        requestAnimationFrame(animate);
    }

    window.addEventListener('mousemove', function(e){
        mouseMoving = true;
        mouseX = e.clientX;
        mouseY = e.clientY;
        clearTimeout(mouseMoveChecker);
        mouseMoveChecker = setTimeout(function(){
            mouseMoving = false;
        }, 100);
    }, { passive: true });

    window.onresize = function(){
        setCanvasSize();
    };

    function drawIfMouseMoving(){
        if (!mouseMoving) return;

        var alive = [];
        for (var i = 0; i < dots.length; i++) {
            if (dots[i] && !dots[i].dead) {
                dots[i].id = alive.length;
                alive.push(dots[i]);
            }
        }
        dots = alive;

        if (dots.length == 0) {
            dots[0] = new Dot(0, mouseX, mouseY);
            dots[0].draw();
            return;
        }

        var previousDot = dots[dots.length - 1];
        var prevX = previousDot.x;
        var prevY = previousDot.y;

        var diffX = Math.abs(prevX - mouseX);
        var diffY = Math.abs(prevY - mouseY);

        if (diffX < dotsMinDist || diffY < dotsMinDist) return;

        var xVariation = Math.random() > .5 ? -1 : 1;
        xVariation = xVariation*Math.floor(Math.random()*maxDistFromCursor)+1;
        var yVariation = Math.random() > .5 ? -1 : 1;
        yVariation = yVariation*Math.floor(Math.random()*maxDistFromCursor)+1;
        dots[dots.length] = new Dot(dots.length, mouseX+xVariation, mouseY+yVariation);
        dots[dots.length-1].draw();
        dots[dots.length-1].link();
    }

    function degToRad(deg) {
        return deg * (Math.PI / 180);
    }
    </script>
